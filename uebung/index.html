<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Atemkreis</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://oleapps.github.io/Atemkreis/uebung/">
<meta property="og:title" content="Atemkreis">
<meta property="og:description" content="Geteilte Atemübung · Shared breathing exercise">
<meta property="og:image" content="https://oleapps.github.io/Atemkreis/uebung/vorschau.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Atemkreis">
<!--
  Geteilte Übung (Atemkreis, 01.11.2026). Die Übung steht nur im Fragment
  hinter „#“ — ein Browser schickt es nie an diese Seite. Die Seite liest es
  nur hier, lokal, und zeigt den Namen als Text. Kein Skript, keine Schrift
  und kein Bild von außen, keine Anfrage, kein Zähler. Die og-Angaben sind
  die Vorschaukarte im Messenger; sie kennt die Übung nicht (das Fragment
  erreicht den Messenger-Abruf nie), das Bild liegt neben dieser Seite.
  Quelle im App-Repository: web/Atemkreis/uebung/index.html (bewacht in
  tests/core/teilen.test.ts).
-->
<style>
  :root { --bg: #F4F1EC; --text: #1E2A33; --muted: #5B6670; --accent: #2C6288; --on-accent: #FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121A20; --text: #E8ECEF; --muted: #A5B0B8; --accent: #7FA8C4; --on-accent: #0E161C; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  .kreis { width: 96px; height: 96px; margin: 0 auto 28px; border-radius: 50%;
           border: 6px solid var(--accent); }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  .name { font-size: 26px; font-weight: 700; margin: 0 0 32px; overflow-wrap: anywhere; }
  a.knopf { display: block; margin: 0 0 14px; padding: 15px 20px; border-radius: 999px;
            text-decoration: none; font-weight: 600; }
  a.haupt { background: var(--accent); color: var(--on-accent); }
  a.neben { border: 2px solid var(--accent); color: var(--accent); }
  p.leise { color: var(--muted); font-size: 15px; margin-top: 28px; }
  p.hinweis { color: var(--muted); font-size: 14px; margin: -4px 0 18px; }
</style>
</head>
<body>
<main>
  <div class="kreis" aria-hidden="true"></div>
  <h1 id="titel">Dir wurde eine Atemübung geschickt</h1>
  <p class="name" id="name"></p>
  <a class="knopf haupt" id="oeffnen" href="#">In Atemkreis öffnen</a>
  <p class="hinweis" id="hinweis" hidden></p>
  <a class="knopf neben" id="store" href="https://play.google.com/store/apps/details?id=de.ole.breathing">Atemkreis im Play Store</a>
  <p class="leise" id="leise">Atemkreis: Atemübungen, Meditation, PMR und Bodyscan. Ohne Konto, ohne Werbung, offline.</p>
</main>
<script>
(function () {
  var PLAY = 'https://play.google.com/store/apps/details?id=de.ole.breathing';
  var deutsch = (navigator.language || '').toLowerCase().indexOf('de') === 0;
  var T = deutsch
    ? { titel: 'Dir wurde eine Atemübung geschickt:', empfohlen: 'Dir wurde eine Übung empfohlen:', ohne: 'Dir wurde eine Atemübung geschickt', oeffnen: 'In Atemkreis öffnen', store: 'Atemkreis im Play Store', hinweis: 'Öffnet sich Atemkreis mit einer Fehlermeldung? Dann aktualisiere die App im Play Store.', leise: 'Atemkreis: Atemübungen, Meditation, PMR und Bodyscan. Ohne Konto, ohne Werbung, offline.' }
    : { titel: 'Someone sent you a breathing exercise:', empfohlen: 'Someone recommended an exercise:', ohne: 'Someone sent you a breathing exercise', oeffnen: 'Open in Atemkreis', store: 'Get Atemkreis on Google Play', hinweis: 'Does Atemkreis open with an error? Update the app in the Play Store.', leise: 'Atemkreis: breathing exercises, meditation, PMR and body scan. No account, no ads, offline.' };
  document.documentElement.lang = deutsch ? 'de' : 'en';

  // Das Fragment: „<fassung>.<daten>“, Base64url. Nur der Name wird gelesen.
  // Fassung 1: UTF-8-JSON, Name in „n“. Fassung 2 (eigene Übung) und 3
  // (Vorlage): gepackte Bytes — ein Byte Merkmale, dann Zahlen (je ein bis
  // vier Bytes), mit Merkmal 128 ein Erweiterungsblock (Länge, dann Bytes),
  // zuletzt der Name in UTF-8; alles vor dem Namen wird nur übersprungen
  // (core/model/shareLink.ts).
  var fragment = location.hash.replace(/^#/, '');
  var name = '';
  var m = /^(\d{1,4})\.([A-Za-z0-9_-]+)$/.exec(fragment);
  function text(bytes) { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
  function nameAus(fassung, bytes) {
    if (fassung === '1') {
      var daten = JSON.parse(text(bytes));
      return daten && typeof daten.n === 'string' ? daten.n : '';
    }
    if ((fassung !== '2' && fassung !== '3') || bytes.length < 1) return '';
    var f = bytes[0], i = 1;
    function zahl() {
      var n = 0, faktor = 1;
      for (var k = 0; k < 4; k++) {
        var b = bytes[i++];
        if (b === undefined) throw new Error('kurz');
        n += (b & 127) * faktor;
        if (b < 128) return n;
        faktor *= 128;
      }
      throw new Error('lang');
    }
    function ueberspringe(anzahl) { for (var k = 0; k < anzahl; k++) zahl(); }
    if (fassung === '3') {
      if (f & 127) return '';
      ueberspringe(1);                                            // Vorlage
    } else {
      ueberspringe(f & 2 ? 5 : 4);                                // Muster, Nachatmen
      if (f & 1) { ueberspringe(2); ueberspringe(zahl() + (f & 64 ? 2 : 0) + 1); } // Runden
      else ueberspringe(1);                                       // Gesamtdauer
      if (f & 4) ueberspringe(1);                                 // Ausklang
    }
    if (f & 128) {                                                // Erweiterung
      var laenge = zahl();
      i += laenge;
      if (i > bytes.length) throw new Error('kurz');
    }
    return text(bytes.subarray(i));
  }
  if (m) {
    try {
      var b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var binaer = atob(b64);
      var bytes = new Uint8Array(binaer.length);
      for (var i = 0; i < binaer.length; i++) bytes[i] = binaer.charCodeAt(i);
      name = nameAus(m[1], bytes).trim().slice(0, 48);
    } catch (e) { name = ''; }
  }

  document.getElementById('titel').textContent = name ? (m[1] === '3' ? T.empfohlen : T.titel) : T.ohne;
  document.getElementById('name').textContent = name;
  document.getElementById('store').textContent = T.store;
  document.getElementById('leise').textContent = T.leise;

  // Rückfall, wenn der App Link nicht greift: Android öffnet Atemkreis über
  // das Schema der App, sonst den Play Store. Gebaut hier, lokal.
  var oeffnen = document.getElementById('oeffnen');
  oeffnen.textContent = T.oeffnen;
  if (m && /android/i.test(navigator.userAgent)) {
    oeffnen.href = 'intent://teilen/' + m[1] + '.' + m[2] +
      '#Intent;scheme=atemraum;S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
    // Fassungen vor dem Teilen kennen `atemraum://teilen/…` nicht und zeigen
    // eine Fehlerseite (02.11.2026) — der leise Hinweis nur hier, auf Android.
    var hinweis = document.getElementById('hinweis');
    hinweis.textContent = T.hinweis;
    hinweis.hidden = false;
  } else {
    oeffnen.style.display = 'none';
  }
})();
</script>
</body>
</html>
